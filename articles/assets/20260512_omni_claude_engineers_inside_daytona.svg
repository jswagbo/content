<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Daytona workspace running an AI engineer</title>
  <desc id="desc">A diagram showing a Git repository with a Dev Container creating a Daytona workspace where Omni Engineer can edit and test code.</desc>
  <rect width="1200" height="630" fill="#0b1020"/>
  <rect x="70" y="90" width="270" height="170" rx="24" fill="#16213e" stroke="#7aa2ff" stroke-width="3"/>
  <text x="205" y="150" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">Git Repo</text>
  <text x="205" y="198" text-anchor="middle" fill="#b7c8ff" font-family="Arial, sans-serif" font-size="24">.devcontainer</text>
  <text x="205" y="232" text-anchor="middle" fill="#b7c8ff" font-family="Arial, sans-serif" font-size="24">requirements.txt</text>
  <path d="M360 175 H500" stroke="#7aa2ff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="520" y="70" width="300" height="210" rx="28" fill="#132f2c" stroke="#37d399" stroke-width="3"/>
  <text x="670" y="138" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="36" font-weight="700">Daytona</text>
  <text x="670" y="190" text-anchor="middle" fill="#b8ffe8" font-family="Arial, sans-serif" font-size="25">Workspace</text>
  <text x="670" y="226" text-anchor="middle" fill="#b8ffe8" font-family="Arial, sans-serif" font-size="22">Python 3.11 + deps</text>
  <path d="M840 175 H980" stroke="#37d399" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="1000" y="90" width="150" height="170" rx="24" fill="#2b1b42" stroke="#d79bff" stroke-width="3"/>
  <text x="1075" y="151" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Omni</text>
  <text x="1075" y="191" text-anchor="middle" fill="#efd8ff" font-family="Arial, sans-serif" font-size="24">Engineer</text>
  <rect x="220" y="380" width="760" height="110" rx="20" fill="#111827" stroke="#fbbf24" stroke-width="3"/>
  <text x="600" y="425" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Edit code, run tests, commit changes</text>
  <text x="600" y="463" text-anchor="middle" fill="#fde68a" font-family="Arial, sans-serif" font-size="23">All inside the same reproducible workspace</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#7aa2ff"/>
    </marker>
  </defs>
</svg>

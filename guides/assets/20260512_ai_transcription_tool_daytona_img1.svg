<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Daytona workspace transcription pipeline</title>
  <desc id="desc">A diagram showing a video file converted by ffmpeg, sent to a transcription provider, optionally corrected by an LLM, and saved as a text transcript inside Daytona.</desc>
  <rect width="1200" height="640" fill="#0b1020"/>
  <rect x="64" y="80" width="1072" height="480" rx="32" fill="#111827" stroke="#3b82f6" stroke-width="4"/>
  <text x="600" y="138" fill="#f8fafc" font-family="Arial, sans-serif" font-size="38" font-weight="700" text-anchor="middle">AI transcription workflow in a Daytona workspace</text>
  <g font-family="Arial, sans-serif" font-size="24" fill="#f8fafc" text-anchor="middle">
    <rect x="110" y="245" width="170" height="110" rx="18" fill="#1e293b" stroke="#93c5fd" stroke-width="3"/>
    <text x="195" y="292">MP4 / MOV</text>
    <text x="195" y="326" fill="#bfdbfe" font-size="18">source video</text>
    <rect x="360" y="245" width="170" height="110" rx="18" fill="#1e293b" stroke="#93c5fd" stroke-width="3"/>
    <text x="445" y="292">ffmpeg</text>
    <text x="445" y="326" fill="#bfdbfe" font-size="18">extract MP3</text>
    <rect x="610" y="245" width="190" height="110" rx="18" fill="#1e293b" stroke="#93c5fd" stroke-width="3"/>
    <text x="705" y="292">Whisper API</text>
    <text x="705" y="326" fill="#bfdbfe" font-size="18">OpenAI / Groq / Azure</text>
    <rect x="880" y="245" width="200" height="110" rx="18" fill="#1e293b" stroke="#93c5fd" stroke-width="3"/>
    <text x="980" y="292">Transcript</text>
    <text x="980" y="326" fill="#bfdbfe" font-size="18">.txt output</text>
  </g>
  <g stroke="#60a5fa" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M280 300 H350"/>
    <path d="M530 300 H600"/>
    <path d="M800 300 H870"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>
  <text x="600" y="430" fill="#dbeafe" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Daytona keeps ffmpeg, Python dependencies, API keys, and test media isolated from your laptop.</text>
  <text x="600" y="470" fill="#93c5fd" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Optional correction step: use an LLM to clean names, punctuation, and formatting after transcription.</text>
</svg>
